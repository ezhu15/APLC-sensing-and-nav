services:
  dev:
    build:
      context: .
      args:
        LOCAL_UID: "${LOCAL_UID:?Set LOCAL_UID to your host user ID}"
        LOCAL_GID: "${LOCAL_GID:?Set LOCAL_GID to your host group ID}"
    image: aplc-dev:jazzy
    working_dir: /ws
    user: "${LOCAL_UID:?Set LOCAL_UID to your host user ID}:${LOCAL_GID:?Set LOCAL_GID to your host group ID}"
    volumes:
      - .:/ws
    stdin_open: true
    tty: true
