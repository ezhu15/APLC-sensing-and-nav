services:
  gazebo:
    extends:
      file: compose.yml
      service: dev
    environment:
      DISPLAY: "${DISPLAY:?Run from your graphical desktop session}"
      XAUTHORITY: /tmp/container.xauth
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      APLC_WORLD: "${APLC_WORLD:-house_1.sdf}"
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${GAZEBO_XAUTHORITY:?Use scripts/docker-gazebo.sh}"
        target: /tmp/container.xauth
        read_only: true
        bind:
          create_host_path: false
    shm_size: 1gb
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /ws/install/setup.bash ]; then
          echo 'Build the workspace first: bash scripts/docker-dev.sh run --rm dev bash -c "colcon build --symlink-install"' >&2
          exit 1
        fi
        source /ws/install/setup.bash
        if ! ros2 pkg prefix aplc_gazebo > /dev/null 2>&1; then
          echo 'aplc_gazebo is not installed. Rebuild the workspace with colcon build --symlink-install.' >&2
          exit 1
        fi
        # Install new GUI assets and helper executables after branch updates.
        colcon build --symlink-install --packages-select aplc_gazebo
        source /ws/install/setup.bash
        exec ros2 launch aplc_gazebo world.launch.py "world:=$$APLC_WORLD"
