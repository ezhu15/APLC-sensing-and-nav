# RTAB-Map parameters shared by mapping and localization (#25).
# ROS-side settings (frames, topics, database) are set in the launch files. Values for
# RTAB-Map's own parameters (names with a "/") must be strings.
# See docs/localization/rtabmap.md for the reasoning behind each choice.
rtabmap:
  ros__parameters:
    # --- Registration -------------------------------------------------------------------
    # The APLC drives on the floor: estimate only x, y and yaw between frames and in the
    # map. Matches the EKF's two_d_mode; z, roll and pitch from noisy visual matches would
    # only add error.
    Reg/Force3DoF: "true"
    # Visual registration (feature matching on the RGB-D images). There is no lidar.
    Reg/Strategy: "0"
    # Features needed to accept a match between two frames (default). Lower accepts more
    # matches on plain walls but risks wrong ones.
    Vis/MinInliers: "20"

    # --- Map update ---------------------------------------------------------------------
    # Process at most 1 frame per second for loop closure / localization (default). The
    # EKF provides smooth motion in between.
    Rtabmap/DetectionRate: "1"
    # Add a map node after 0.1 m or 0.1 rad of motion (defaults); nothing is added while
    # the robot stands still.
    RGBD/LinearUpdate: "0.1"
    RGBD/AngularUpdate: "0.1"

    # --- 2D occupancy grid (for RViz now, Nav2 later) -----------------------------------
    # Build the grid from the depth image. (Older RTAB-Map versions called this
    # Grid/FromDepth; 0.23 uses Grid/Sensor: 0 = laser, 1 = depth, 2 = both.)
    Grid/Sensor: "1"
    # A flat 2D grid (projected on the floor plane), which is what Nav2 uses.
    Grid/3D: "false"
    # 5 cm cells (default).
    Grid/CellSize: "0.05"
    # The D435's depth error grows with the square of distance (about 2 % at 2 m); beyond
    # ~4 m it is too noisy to mark obstacles reliably. Ignore points closer than the
    # camera's 0.2 m minimum range.
    Grid/RangeMax: "4.0"
    Grid/RangeMin: "0.2"
    # Ground vs obstacle by surface normal: points whose normal is within 15 deg of
    # vertical are ground. The 1:12 ramp is 4.76 deg, so it stays ground with margin for
    # depth noise in the normals; walls, steps and furniture sides are obstacles.
    Grid/NormalsSegmentation: "true"
    Grid/MaxGroundAngle: "15"
    # Flat surfaces count as ground only up to 0.5 m above the robot's own floor. Heights
    # are in frame_id (base_footprint) for each map node; with 3-DoF poses (Force3DoF and
    # the EKF's two_d_mode) every node sits at z = 0, so this is also the height in the map.
    # Must clear the ramp: from its foot, the ramp surface within Grid/RangeMax (4 m)
    # rises at most 4/12 = 0.33 m above the robot. The camera is 0.236 m high, so it only
    # sees the tops of surfaces lower than that; higher furniture shows only its vertical
    # sides, which are obstacles by Grid/MaxGroundAngle. Stair risers and the landing's
    # side faces are vertical too. Known limit: the first stair tread (0.18 m) is low and
    # flat, so it counts as ground at any value that keeps the ramp ground.
    Grid/MaxGroundHeight: "0.5"
    # Ignore points above 2.0 m (ceilings are 2.7 m); the robot never reaches them.
    Grid/MaxObstacleHeight: "2.0"
