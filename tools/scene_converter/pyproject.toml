[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aplc-scene-converter"
version = "0.1.0"
description = "Portable Quest scene maps and deterministic Gazebo geometry"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aplc-scene = "aplc_scene.__main__:main"

[tool.setuptools.packages.find]
include = ["aplc_scene*"]
